name: Daily activity

on:
  schedule:
    # Runs every day at 13:00 UTC. GitHub cron can be delayed a few minutes to an hour.
    - cron: "0 13 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make daily commits
        env:
          GIT_AUTHOR_NAME: GuoGuoLinLinRanger
          GIT_AUTHOR_EMAIL: simontong2016@gmail.com
          GIT_COMMITTER_NAME: GuoGuoLinLinRanger
          GIT_COMMITTER_EMAIL: simontong2016@gmail.com
        run: |
          set -e
          # Make a random number (1-4) of small commits so the graph looks organic.
          COUNT=$(( (RANDOM % 4) + 1 ))
          for i in $(seq 1 "$COUNT"); do
            echo "$(date -u '+%Y-%m-%dT%H:%M:%SZ') - activity $i" >> activity.log
            git add activity.log
            git commit -m "chore: update activity log ($(date -u '+%Y-%m-%d') #$i)"
          done
          git push
