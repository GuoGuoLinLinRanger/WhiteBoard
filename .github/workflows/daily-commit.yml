name: Daily activity

on:
  schedule:
    # Runs every day at 13:00 UTC. GitHub cron can be delayed a few minutes to an hour.
    - cron: "0 13 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make daily commits
        env:
          GIT_AUTHOR_NAME: GuoGuoLinLinRanger
          GIT_AUTHOR_EMAIL: simontong2016@gmail.com
          GIT_COMMITTER_NAME: GuoGuoLinLinRanger
          GIT_COMMITTER_EMAIL: simontong2016@gmail.com
        run: bash scripts/daily.sh
